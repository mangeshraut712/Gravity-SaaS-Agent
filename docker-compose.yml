services:
  # ============================================================================
  # Gateway Service
  # ============================================================================
  gateway:
    build:
      context: .
      dockerfile: ./apps/gateway/Dockerfile
      target: runner
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=production
      - PORT=3001
      - HOST=0.0.0.0
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=gravity
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - JWT_SECRET=${JWT_SECRET}
      - CORS_ORIGINS=${CORS_ORIGINS}
      - LOG_LEVEL=info
      - ENABLE_METRICS=true
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - gravity-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", 'require("http").get("http://localhost:3001/health", ({ statusCode }) => process.exit(statusCode === 200 ? 0 : 1)).on("error", () => process.exit(1))']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 512M

  # ============================================================================
  # Dashboard (Next.js) Service
  # ============================================================================
  dashboard:
    build:
      context: .
      dockerfile: ./apps/dashboard/Dockerfile
      target: runner
      args:
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY}
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL}
        NEXT_PUBLIC_POLAR_PRO_PRODUCT_ID: ${NEXT_PUBLIC_POLAR_PRO_PRODUCT_ID}
        NEXT_PUBLIC_POLAR_BUSINESS_PRODUCT_ID: ${NEXT_PUBLIC_POLAR_BUSINESS_PRODUCT_ID}
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - NEXT_PUBLIC_API_URL=http://gateway:3001
      - NEXT_PUBLIC_SUPABASE_URL=${NEXT_PUBLIC_SUPABASE_URL}
      - NEXT_PUBLIC_SUPABASE_ANON_KEY=${NEXT_PUBLIC_SUPABASE_ANON_KEY}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}
      - APP_URL=${APP_URL}
      - POLAR_PRO_PRODUCT_ID=${POLAR_PRO_PRODUCT_ID}
      - POLAR_BUSINESS_PRODUCT_ID=${POLAR_BUSINESS_PRODUCT_ID}
      - POLAR_WEBHOOK_SECRET=${POLAR_WEBHOOK_SECRET}
    depends_on:
      - gateway
    networks:
      - gravity-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", 'require("http").get("http://localhost:3000/api/health", ({ statusCode }) => process.exit(statusCode === 200 ? 0 : 1)).on("error", () => process.exit(1))']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M

  # ============================================================================
  # PostgreSQL Database
  # ============================================================================
  # Optional generic PostgreSQL for local experiments. The application uses
  # Supabase for account data; its Supabase schema cannot run in this service
  # because it depends on Supabase-managed auth and realtime schemas.
  postgres:
    image: postgres:15-alpine
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_DB=gravity
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - gravity-net
    restart: unless-stopped
    profiles:
      - legacy-postgres
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${DB_USER} -d gravity" ]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M

  # ============================================================================
  # Redis Cache
  # ============================================================================
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    networks:
      - gravity-net
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 256M
        reservations:
          cpus: '0.125'
          memory: 128M

  # ============================================================================
  # Nginx Reverse Proxy (Optional)
  # ============================================================================
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - gateway
      - dashboard
    networks:
      - gravity-net
    restart: unless-stopped
    profiles:
      - production

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  gravity-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16
